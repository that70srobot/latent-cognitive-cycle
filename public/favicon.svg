<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c1938" />
      <stop offset="75%" stop-color="#030714" />
      <stop offset="100%" stop-color="#02040a" />
    </radialGradient>

    <!-- Hull Titanium Gradient -->
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Center Fuselage Core Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Main Thruster Fire Gradient -->
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="rgba(239, 68, 68, 0)" />
    </linearGradient>

    <!-- RCS Stabilizer Jet Gradient -->
    <linearGradient id="rcsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Deep-Space Circular Backdrop with Tactical Reticle Ring -->
  <circle cx="32" cy="32" r="30" fill="url(#spaceBg)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.55" />
  <circle cx="32" cy="32" r="26" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.25" stroke-dasharray="3,3" />

  <!-- Stars / Space Dust -->
  <circle cx="14" cy="18" r="0.75" fill="#ffffff" opacity="0.8" />
  <circle cx="48" cy="16" r="0.6" fill="#38bdf8" opacity="0.9" />
  <circle cx="50" cy="46" r="0.8" fill="#ffffff" opacity="0.7" />
  <circle cx="15" cy="48" r="0.6" fill="#00f2fe" opacity="0.8" />

  <!-- Main Engine Exhaust Plume (Firing Downward) -->
  <path d="M 28 44 Q 32 63 32 60 Q 32 63 36 44 Z" fill="url(#fireGrad)" filter="url(#glow)" />
  <path d="M 29.5 44 L 32 54 L 34.5 44 Z" fill="#ffffff" opacity="0.95" />

  <!-- Left (Port) Stabilizer RCS Thruster & Plasma Jet -->
  <path d="M 16 39 L 18 48 L 20 39 Z" fill="url(#rcsGrad)" filter="url(#glow)" />
  <rect x="17" y="27" width="4" height="6" fill="#1e293b" />
  <rect x="15.5" y="31" width="5.5" height="6" fill="#334155" rx="0.8" />
  <polygon points="16,37 15,39 21,39 20,37" fill="#94a3b8" />

  <!-- Right (Starboard) Stabilizer RCS Thruster & Plasma Jet -->
  <path d="M 44 39 L 46 48 L 48 39 Z" fill="url(#rcsGrad)" filter="url(#glow)" />
  <rect x="43" y="27" width="4" height="6" fill="#1e293b" />
  <rect x="43" y="31" width="5.5" height="6" fill="#334155" rx="0.8" />
  <polygon points="44,37 43,39 49,39 48,37" fill="#94a3b8" />

  <!-- Rocket Main Hull & Delta Wings -->
  <!-- Aerodynamic nose cone (32, 6) down to wings (14, 42) & (50, 42) -->
  <path d="M 32 6 
           L 41 24 
           L 50 42 
           L 39 42 
           L 36.5 44.5 
           L 27.5 44.5 
           L 25 42 
           L 14 42 
           L 23 24 Z" 
        fill="url(#hullGrad)" 
        stroke="#38bdf8" 
        stroke-width="1.4" 
        stroke-linejoin="round" />

  <!-- High-Contrast Fuselage Center Core -->
  <path d="M 32 10 
           L 36.5 28 
           L 35.5 41 
           L 28.5 41 
           L 27.5 28 Z" 
        fill="url(#coreGrad)" 
        stroke="#00f2fe" 
        stroke-width="0.8" />

  <!-- Glowing Cockpit Window / Sensor Visor -->
  <circle cx="32" cy="20" r="3.6" fill="#00f2fe" stroke="#ffffff" stroke-width="0.9" filter="url(#glow)" />
  <circle cx="31" cy="18.8" r="1.1" fill="#ffffff" opacity="0.9" />

  <!-- Engine Nozzle Base Rim -->
  <rect x="27.5" y="43" width="9" height="2" fill="#475569" stroke="#94a3b8" stroke-width="0.6" rx="0.5" />
</svg>
