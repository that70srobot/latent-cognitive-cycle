<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bioluminescent Fireflies Screensaver</title>
  <meta name="description" content="A standalone, ambient, interactive bioluminescent firefly screensaver.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #03080c 0%, #010406 60%, #000203 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      user-select: none;
      cursor: crosshair;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #ui-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 18px;
      border-radius: 9999px;
      background: rgba(3, 10, 8, 0.7);
      border: 1px solid rgba(163, 230, 53, 0.25);
      color: #a3e635;
      font-size: 11px;
      font-family: monospace;
      letter-spacing: 0.08em;
      pointer-events: none;
      backdrop-filter: blur(12px);
      transition: opacity 2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .glow-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #bef264;
      box-shadow: 0 0 10px #bef264;
      animation: fireflyPulse 2.5s infinite ease-in-out;
    }
    @keyframes fireflyPulse {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui-hint">
    <span class="glow-dot"></span>
    <span>Bioluminescent Fireflies · Move cursor to attract · Click to ignite pulse</span>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const hint = document.getElementById('ui-hint');

    setTimeout(() => {
      hint.style.opacity = '0';
    }, 4500);

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Natural firefly palette: soft yellow-green, chartreuse, golden amber, warm honey
    const FIREFLY_COLORS = [
      { r: 190, g: 242, b: 100 }, // #bef264 - Lime glow
      { r: 253, g: 224, b: 71 },  // #fde047 - Soft yellow gold
      { r: 163, g: 230, b: 53 },  // #a3e635 - Vibrant chartreuse
      { r: 251, g: 191, b: 36 },  // #fbbf24 - Warm amber
      { r: 110, g: 231, b: 183 }  // #6ee7b7 - Ethereal green-cyan
    ];

    class Firefly {
      constructor() {
        this.reset(true);
      }

      reset(initial = false) {
        this.x = Math.random() * width;
        this.y = initial ? Math.random() * height : height + 10;
        
        // Gentle organic flutter velocity
        this.vx = (Math.random() - 0.5) * 0.6;
        this.vy = -(Math.random() * 0.4 + 0.15); // gentle natural upward drift
        
        this.targetVx = this.vx;
        this.targetVy = this.vy;
        
        this.size = Math.random() * 2.2 + 1.2;
        this.color = FIREFLY_COLORS[Math.floor(Math.random() * FIREFLY_COLORS.length)];
        
        // Biological blinking cycle
        this.phase = Math.random() * Math.PI * 2;
        this.flashSpeed = Math.random() * 0.025 + 0.012; // slow breathing cycle
        this.glowHold = Math.random() * 0.4 + 0.6;
        
        // Wing flutter jitter
        this.jitterTimer = Math.floor(Math.random() * 60);
        this.depth = Math.random() * 0.6 + 0.4; // 3D depth layer
      }

      update(time, mouse) {
        // Natural firefly flutter: periodically pick a slight new wandering heading
        this.jitterTimer--;
        if (this.jitterTimer <= 0) {
          this.targetVx = (Math.random() - 0.5) * 1.0;
          this.targetVy = (Math.random() - 0.5) * 0.6 - 0.15;
          this.jitterTimer = Math.floor(Math.random() * 80 + 30);
        }

        // Smooth interpolation toward target velocity
        this.vx += (this.targetVx - this.vx) * 0.04;
        this.vy += (this.targetVy - this.vy) * 0.04;

        // Subtle micro-flutter
        const microJitterX = (Math.random() - 0.5) * 0.25;
        const microJitterY = (Math.random() - 0.5) * 0.25;

        // Soft curiosity towards mouse cursor
        if (mouse.active) {
          const dx = mouse.x - this.x;
          const dy = mouse.y - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 260 && dist > 20) {
            const force = (1 - dist / 260) * 0.06;
            this.vx += (dx / dist) * force;
            this.vy += (dy / dist) * force;
          }
        }

        this.x += (this.vx + microJitterX) * this.depth;
        this.y += (this.vy + microJitterY) * this.depth;

        // Wrap around borders gently
        if (this.x < -30) this.x = width + 20;
        if (this.x > width + 30) this.x = -20;
        if (this.y < -30) this.y = height + 20;
        if (this.y > height + 30) this.y = -20;

        // Update bioluminescent pulse
        this.phase += this.flashSpeed;
      }

      draw(ctx) {
        // Asymmetric pulse: sudden gentle flare up, lingering glow, slow fade
        const sinVal = Math.sin(this.phase);
        let brightness = Math.max(0, sinVal);
        brightness = Math.pow(brightness, 2.5); // Sharpen flash curve

        // Ambient resting lantern light (never 100% black)
        const alpha = 0.08 + brightness * 0.92;
        const currentSize = this.size * (0.8 + brightness * 0.7) * this.depth;

        const { r, g, b } = this.color;

        // 1. Soft wide bioluminescent outer glow
        if (alpha > 0.15) {
          const outerRadius = currentSize * (12 + brightness * 14);
          const outerGrad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, outerRadius);
          outerGrad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${alpha * 0.45})`);
          outerGrad.addColorStop(0.35, `rgba(${r}, ${g}, ${b}, ${alpha * 0.18})`);
          outerGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

          ctx.beginPath();
          ctx.fillStyle = outerGrad;
          ctx.arc(this.x, this.y, outerRadius, 0, Math.PI * 2);
          ctx.fill();
        }

        // 2. Bright intense inner halo
        const innerRadius = currentSize * (3.5 + brightness * 3);
        const innerGrad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, innerRadius);
        innerGrad.addColorStop(0, `rgba(255, 255, 255, ${alpha * 0.95})`);
        innerGrad.addColorStop(0.4, `rgba(${r}, ${g}, ${b}, ${alpha * 0.8})`);
        innerGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

        ctx.beginPath();
        ctx.fillStyle = innerGrad;
        ctx.arc(this.x, this.y, innerRadius, 0, Math.PI * 2);
        ctx.fill();

        // 3. Tiny radiant white core
        ctx.beginPath();
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.min(1, alpha * 1.2)})`;
        ctx.arc(this.x, this.y, currentSize * 0.7, 0, Math.PI * 2);
        ctx.fill();
      }

      ignite() {
        // Force firefly to flare up warmly
        this.phase = Math.PI * 0.5;
      }
    }

    // Floating background forest dust motes
    const spores = [];
    for (let i = 0; i < 90; i++) {
      spores.push({
        x: Math.random() * width,
        y: Math.random() * height,
        vy: -(Math.random() * 0.2 + 0.05),
        vx: (Math.random() - 0.5) * 0.15,
        size: Math.random() * 1.2 + 0.5,
        alpha: Math.random() * 0.35 + 0.1
      });
    }

    // Instantiate 140 fireflies
    const fireflyCount = 140;
    const fireflies = [];
    for (let i = 0; i < fireflyCount; i++) {
      fireflies.push(new Firefly());
    }

    // Interactive mouse tracking
    const mouse = { x: width / 2, y: height / 2, active: false };
    let mouseTimeout;

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      mouse.active = true;
      clearTimeout(mouseTimeout);
      mouseTimeout = setTimeout(() => {
        mouse.active = false;
      }, 3000);
    });

    // Web Audio gentle nocturnal chime
    let audioCtx = null;
    function playChime() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const notes = [523.25, 659.25, 783.99, 880, 1046.5, 1318.5]; // C5, E5, G5, A5, C6, E6
        osc.frequency.setValueAtTime(notes[Math.floor(Math.random() * notes.length)], now);
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.04, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 1.2);
      } catch (e) {}
    }

    // Click to send ripple light wave igniting fireflies
    window.addEventListener('click', (e) => {
      playChime();
      const clickX = e.clientX;
      const clickY = e.clientY;

      for (const f of fireflies) {
        const dx = f.x - clickX;
        const dy = f.y - clickY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 320) {
          // Delay ignition slightly based on distance for ripple effect
          setTimeout(() => {
            f.ignite();
          }, dist * 0.8);
        }
      }
    });

    // Main animation loop
    let time = 0;
    function animate() {
      requestAnimationFrame(animate);
      time += 0.016;

      // Soft trailing night sky
      ctx.fillStyle = 'rgba(2, 5, 8, 0.28)';
      ctx.fillRect(0, 0, width, height);

      // Draw faint floating spores in background
      ctx.save();
      for (const s of spores) {
        s.y += s.vy;
        s.x += s.vx;
        if (s.y < 0) s.y = height;
        if (s.x < 0) s.x = width;
        if (s.x > width) s.x = 0;

        ctx.beginPath();
        ctx.fillStyle = `rgba(163, 230, 53, ${s.alpha * 0.5})`;
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // Draw Fireflies with additive luminous blending
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (const f of fireflies) {
        f.update(time, mouse);
        f.draw(ctx);
      }
      ctx.restore();
    }

    animate();
  </script>
</body>
</html>
