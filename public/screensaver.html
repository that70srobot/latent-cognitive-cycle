<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shinys Cosmic Screensaver</title>
  <meta name="description" content="Pure glowing stardust, cosmic glyphs, and interactive particle field.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #03050c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      user-select: none;
      cursor: crosshair;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #ui-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      border-radius: 9999px;
      background: rgba(10, 15, 30, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #94a3b8;
      font-size: 12px;
      font-family: monospace;
      letter-spacing: 0.05em;
      pointer-events: none;
      backdrop-filter: blur(8px);
      transition: opacity 1.5s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00f2fe;
      box-shadow: 0 0 10px #00f2fe;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.4); opacity: 1; }
    }
    #back-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 8px 16px;
      border-radius: 9999px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      font-size: 11px;
      font-family: monospace;
      text-decoration: none;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    #back-btn:hover {
      background: rgba(14, 116, 144, 0.5);
      color: #fff;
      border-color: #38bdf8;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <a id="back-btn" href="./">← Cognitive Cycle</a>
  <div id="ui-hint">
    <span class="pulse-dot"></span>
    <span>Cosmic Screensaver · Move cursor for stardust · Click for shockwave</span>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const hint = document.getElementById('ui-hint');

    setTimeout(() => {
      hint.style.opacity = '0';
    }, 4000);

    const SHINY_COLORS = [
      '#00f2fe', '#4facfe', '#a855f7', '#c084fc',
      '#ec4899', '#38bdf8', '#fbcfe8', '#fef08a'
    ];
    const GLYPHS = ['Σ', '∞', 'ψ', '∇', 'λ', 'Ω', '∮', '≈', '⊗', '✨', '✦', '✳', '⟲', '◈'];

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Sound synth
    let audioCtx = null;
    function playChime() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const notes = [440, 523.25, 659.25, 783.99, 880, 1046.5];
        osc.frequency.setValueAtTime(notes[Math.floor(Math.random() * notes.length)], now);
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.8);
      } catch (e) {}
    }

    // Particles
    const particles = [];
    for (let i = 0; i < 450; i++) {
      const baseSize = Math.random() * 2.8 + 1.2;
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 1.2,
        vy: (Math.random() - 0.5) * 1.2,
        baseSize,
        color: SHINY_COLORS[Math.floor(Math.random() * SHINY_COLORS.length)],
        pulsePhase: Math.random() * Math.PI * 2
      });
    }

    // Glyphs
    const glyphs = [];
    for (let i = 0; i < 35; i++) {
      glyphs.push({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 0.5,
        vy: (Math.random() - 0.5) * 0.5,
        char: GLYPHS[Math.floor(Math.random() * GLYPHS.length)],
        size: Math.random() * 18 + 14,
        color: SHINY_COLORS[Math.floor(Math.random() * SHINY_COLORS.length)],
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.015
      });
    }

    // Mouse sparkles
    const sparkles = [];
    let mouse = { x: width / 2, y: height / 2, active: false };

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      mouse.active = true;
      if (Math.random() > 0.3) {
        sparkles.push({
          x: e.clientX,
          y: e.clientY,
          vx: (Math.random() - 0.5) * 3,
          vy: (Math.random() - 0.5) * 3,
          life: 35,
          maxLife: 35,
          color: SHINY_COLORS[Math.floor(Math.random() * SHINY_COLORS.length)],
          size: Math.random() * 3 + 2
        });
      }
    });

    window.addEventListener('click', (e) => {
      playChime();
      for (let i = 0; i < 45; i++) {
        const angle = (i / 45) * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        sparkles.push({
          x: e.clientX,
          y: e.clientY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 50,
          maxLife: 50,
          color: SHINY_COLORS[Math.floor(Math.random() * SHINY_COLORS.length)],
          size: Math.random() * 4 + 2
        });
      }
    });

    let time = 0;
    function animate() {
      requestAnimationFrame(animate);
      time += 0.015;

      ctx.fillStyle = 'rgba(3, 5, 12, 0.2)';
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';

      // Draw Particles
      for (const p of particles) {
        const angle = Math.sin(p.x * 0.003 + time) + Math.cos(p.y * 0.003 + time);
        p.vx += Math.cos(angle) * 0.04;
        p.vy += Math.sin(angle) * 0.04;
        p.vx *= 0.98;
        p.vy *= 0.98;

        if (mouse.active) {
          const dx = mouse.x - p.x;
          const dy = mouse.y - p.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 200 && dist > 5) {
            const force = (1 - dist / 200) * 0.15;
            p.vx += (dx / dist) * force;
            p.vy += (dy / dist) * force;
          }
        }

        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0) p.x = width;
        if (p.x > width) p.x = 0;
        if (p.y < 0) p.y = height;
        if (p.y > height) p.y = 0;

        p.pulsePhase += 0.03;
        const curSize = p.baseSize * (1 + Math.sin(p.pulsePhase) * 0.4);

        ctx.beginPath();
        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, curSize * 3);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.3, p.color);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.arc(p.x, p.y, curSize * 3, 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw Glyphs
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (const g of glyphs) {
        g.x += g.vx;
        g.y += g.vy;
        g.rotation += g.rotSpeed;

        if (g.x < -30) g.x = width + 30;
        if (g.x > width + 30) g.x = -30;
        if (g.y < -30) g.y = height + 30;
        if (g.y > height + 30) g.y = -30;

        ctx.save();
        ctx.translate(g.x, g.y);
        ctx.rotate(g.rotation);
        ctx.font = `${g.size}px serif`;
        ctx.shadowColor = g.color;
        ctx.shadowBlur = 15;
        ctx.fillStyle = g.color;
        ctx.globalAlpha = 0.7 + Math.sin(time * 2 + g.x) * 0.3;
        ctx.fillText(g.char, 0, 0);
        ctx.restore();
      }

      // Draw Sparkles
      for (let i = sparkles.length - 1; i >= 0; i--) {
        const s = sparkles[i];
        s.x += s.vx;
        s.y += s.vy;
        s.life -= 1;
        if (s.life <= 0) {
          sparkles.splice(i, 1);
          continue;
        }
        const prog = s.life / s.maxLife;
        ctx.beginPath();
        const sGrad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size * 2);
        sGrad.addColorStop(0, '#ffffff');
        sGrad.addColorStop(0.4, s.color);
        sGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = sGrad;
        ctx.globalAlpha = prog;
        ctx.arc(s.x, s.y, s.size * 2, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }
    animate();
  </script>
</body>
</html>
